title: Markenstimme und Storytelling – Content-Paket
difficulty: 4
question: |
  **Ausgangslage:** Entwickeln Sie für eine Marke Ihrer Wahl ein **Content-Paket** mit klarer Markenstimme und Storytelling-Struktur.

  ---

  **Phase 1 – Persona**

  1. Erstellen Sie einen **Persona-Block** (Ton, Ansprache, Werte, mindestens 5 No-Gos, verbotene Wörter).
  2. Testen Sie den Block mit einem kurzen Website-Satz in Copilot.
  3. Verfeinern Sie den Block per Folgeprompt, falls das Ergebnis zu generisch wirkt.

  ---

  **Phase 2 – Story-Posts**

  4. Schreiben Sie **zwei LinkedIn-Posts** mit Story-Struktur (Hook → Problem → Wendung → CTA):
     - Post 1: Produkt- oder Feature-Launch
     - Post 2: Thought Leadership (Branchentrend, Meinung, Einordnung)

  5. Nutzen Sie für jeden Post einen **eigenen Prompt** mit Persona-Block und Story-Vorgabe.
  6. Je Post: mindestens **zwei Folgeprompts** (Hook schärfen, CTA anpassen).

  ---

  **Phase 3 – Kreativer Winkel**

  7. Bitten Sie Copilot um **drei kontraintuitive Winkel** für ein Thema Ihrer Marke.
  8. Wählen Sie einen Winkel und schreiben Sie eine **Instagram-Caption** (max. 80 Wörter).

  ---

  **Phase 4 – Abschluss**

  9. Erstellen Sie eine **Prompt-Vorlage** für Story-LinkedIn-Posts mit Platzhaltern.
  10. Wählen Sie den stärksten der drei Texte (2 LinkedIn + 1 Instagram) für eine kurze Vorstellung im Plenum.

  **Deliverables:** Persona-Block, 2 LinkedIn-Posts, 1 Instagram-Caption, Story-Prompt-Vorlage.
tip: |
  Abschluss im Plenum optional: stärksten Text vorlesen. Fokus auf Vergleich der Markenstimmen, kein Feedback-Pflichtprogramm.
solution: |
  Starke Persona: konkret, mit No-Gos, unterscheidbar von generischem „freundlich und professionell". Story-Posts: Hook ohne Klischee, Problem spezifisch, CTA passend.
