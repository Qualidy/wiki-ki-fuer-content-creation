title: Wiederverwendbarer Persona-Block
difficulty: 3
question: |
  Entwickle für eine Marke deiner Wahl (echt oder fiktiv) einen **Persona-Block**, den du in Copilot-Prompts wiederverwenden kannst.

  Der Block soll enthalten:
  - Branche und Zielgruppe
  - Ton und Ansprache (Du/Sie)
  - Mindestens drei No-Gos (verbotene Wörter oder Formulierungen)

  **Schritt 1:** Formuliere den Persona-Block (max. 6 Sätze).

  **Schritt 2:** Nutze ihn in Copilot für drei unterschiedliche Formate:
  1. LinkedIn-Post (max. 800 Zeichen)
  2. Instagram-Caption (max. 80 Wörter)
  3. Newsletter-Betreffzeile + Teaser (2 Sätze)

  **Deliverable:** Persona-Block + drei Texte aus Copilot.
tip: |
  In Copilot werden wiederkehrende Vorgaben direkt im Prompt formuliert – nicht in separaten Profileinstellungen. Der Persona-Block ist dein wiederverwendbares Briefing-Element.
solution: |
  Beispiel-Persona-Block:

  > Marke: Handwerkliche Bäckerei, Zielgruppe Stammkunden 30–60. Ton: bodenständig, warm, Du-Form. No-Gos: keine Gesundheitsversprechen, keine Preise, keine Anglizismen, kein „revolutionär".

  Prompt-Struktur: [Persona-Block] + [Format-Vorgabe] + [Konkrete Aufgabe].
