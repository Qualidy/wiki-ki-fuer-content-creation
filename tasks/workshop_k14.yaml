title: Mini-Kampagne GreenLoop – Bilder und Text
difficulty: 4
question: |
  **Abschluss Midjourney-Woche**

  **Marke:** GreenLoop – Launch Frühjahrskollektion  
  **Zielgruppe:** Frauen 25–40, urban, nachhaltig bewusst

  ---

  **Phase 1 – Kampagnenplan (Stichpunkte)**

  1. Drei Instagram-Posts: je Motiv + Stimmung + Format (1:1 oder 4:5).
  2. Ein gemeinsamer **Look**: sage green, cream, linen, soft daylight.
  3. Drei **Bild-No-Gos** für die ganze Kampagne.

  ---

  **Phase 2 – Referenz & Serie**

  4. Referenzbild erzeugen und upscalen.
  5. Zwei weitere Motive mit **Stil-Referenz** (z. B. Flat Lay, Detail Stoff, Lifestyle urban).
  6. Je Motiv: beste Variante wählen, bei Bedarf Vary, Upscale.

  ---

  **Phase 3 – Texte in Copilot**

  7. Schreiben Sie in **Copilot** drei kurze Instagram-Captions (max. 60 Wörter, Du-Form) – passend zu den drei Bildern.
  8. Gleiche No-Gos wie in Woche 1 (keine erfundenen Zertifikate, keine Heilsversprechen).

  ---

  **Phase 4 – Paket abschließen**

  9. Kombinieren Sie **ein** Bild + **eine** Caption in Canva/Figma/PowerPoint (Vorschau reicht).
  10. Dokumentieren Sie alle **drei Prompts** und die drei Captions in einer Datei.

  **Deliverables:** 3 Finalbilder, 3 Prompts, 3 Captions, 1 Layout-Vorschau, Prompt-Dokumentation.
tip: |
  Abschluss im Plenum optional: stärkstes Bild+Caption zeigen. Fokus: Zusammenspiel Text (Woche 1) und Bild (Woche 2).
solution: |
  Starke Abgabe: konsistenter Look, keine Text-Artefakte in Bildern, Captions passen zur Stimmung, Prompts vollständig dokumentiert.
