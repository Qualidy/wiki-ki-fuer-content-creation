title: Persona, Multi-Format und Prompt-Vorlage
difficulty: 3
question: |
  Erstelle in **Copilot Chat** einen vollständigen Prompt für eine Marke deiner Wahl, der:

  1. Einen Persona-Block enthält
  2. Drei Formate gleichzeitig produziert: LinkedIn-Post, Instagram-Caption, Newsletter-Teaser
  3. Pro Kanal Format-Vorgaben definiert (Länge, Ton, Hashtags)
  4. Mindestens zwei No-Gos enthält

  Führe den Prompt aus. Korrigiere Verstöße gegen No-Gos per Folgeprompt.

  **Abschluss:** Formuliere den Prompt als **wiederverwendbare Vorlage** mit Platzhaltern in [eckigen Klammern] – bereit für den Einsatz im Arbeitsalltag.
tip: |
  Deliverable: drei kanalspezifische Texte + eine Prompt-Vorlage. Keine Reflexion, sondern einsetzbare Arbeitsergebnisse.
solution: |
  Vorlagen-Struktur:

  > [Persona-Block]. Kernbotschaft: [Botschaft]. Erstelle: 1) LinkedIn ([Länge], [Ton], CTA: [Text]) 2) Instagram ([Länge], [Hashtags]) 3) Newsletter (Betreff + Teaser). No-Gos: [Liste].

  Folgeprompt bei Verstößen: „Formuliere [Format] neu. No-Gos: [Liste]. Übrige Vorgaben beibehalten."
