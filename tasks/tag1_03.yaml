title: Vager vs. präziser Prompt
difficulty: 3
question: |
  Arbeite in **Copilot Chat** mit demselben fiktiven Produkt (z. B. eine App, ein Snack, ein B2B-Tool):

  **Schritt 1 – vager Prompt:**
  > Schreib einen Text über unser neues Produkt.

  **Schritt 2 – präziser Prompt:**
  Formuliere einen Prompt mit mindestens: Produktbeschreibung, Zielgruppe, Kanal (z. B. LinkedIn), Ton, Längenvorgabe, mindestens ein No-Go.

  **Schritt 3 – Feinschliff:**
  Nimm das Ergebnis aus Schritt 2 und verbessere es mit **einem Folgeprompt** (z. B. Hook schärfen, kürzen, CTA ergänzen).

  **Deliverable:** der präzise Prompt aus Schritt 2 und der finale Text aus Schritt 3.
tip: |
  Der Unterschied zwischen Schritt 1 und 2 zeigt, warum präzise Prompts bessere Ergebnisse liefern. Schritt 3 ist der normale Arbeitsablauf nach dem ersten Entwurf.
solution: |
  Beispiel präziser Prompt:

  > Du bist Texter für eine Zeiterfassungs-App für Freelancer (mobil, kostenlos). Schreib einen LinkedIn-Post. Zielgruppe: Selbstständige mit wenig Zeit. Max. 800 Zeichen, Sie-Form, sachlich. No-Go: keine erfundenen Statistiken, keine Superlative. Hook in der ersten Zeile, CTA am Ende.

  Beispiel-Folgeprompt:

  > Formuliere den Hook konkreter. Kein Buzzword. CTA: „Jetzt testen."
