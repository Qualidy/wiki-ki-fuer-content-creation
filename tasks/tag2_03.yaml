title: Winkel entwickeln und Gliederung erstellen
difficulty: 2
question: |
  Gib in **Copilot Chat** ein:

  > Entwickle drei verschiedene Winkel für einen Blog-Artikel zum Thema „KI im Alltag von kleinen Unternehmen". Zielgruppe: Selbstständige und kleine Teams. Je Winkel: Arbeitstitel + ein Satz Differenzierung.

  Wähle einen Winkel und formuliere einen Folgeprompt, der daraus eine **Blog-Gliederung mit drei H2-Abschnitten** erstellt – inkl. kurzer Beschreibung je Abschnitt.
tip: |
  Der Winkel entscheidet, ob ein Artikel austauschbar oder differenziert wirkt. Die Gliederung ist das Briefing für den Schreibprozess.
solution: |
  Beispiel-Folgeprompt:

  > Nimm Winkel 2. Erstelle eine Gliederung mit drei H2-Abschnitten. Je Abschnitt: Überschrift + 1 Satz Inhalt. Zielgruppe: Selbstständige ohne KI-Vorerfahrung. Du-Form.
