title: RCFT-Prompt für reale Content-Aufgabe
difficulty: 3
question: |
  Formuliere für eine Content-Aufgabe aus deinem Arbeitsalltag (oder ein fiktives Szenario) einen **vollständigen RCFT-Prompt** mit allen vier Bausteinen, mindestens zwei No-Gos und klarem Format.

  Führe den Prompt in **Copilot Chat** aus.

  Arbeite das Ergebnis in **zwei Folgeprompts** weiter:
  1. Ton oder Länge anpassen
  2. Für einen zweiten Kanal umschreiben (z. B. von Blog-Absatz zu LinkedIn-Post)

  **Deliverable:** finaler Text für den zweiten Kanal.
tip: |
  RCFT ist dann erfolgreich, wenn der Entwurf ohne große Nacharbeit weiterverwendbar ist – oder mit einem gezielten Folgeprompt fertig wird.
solution: |
  Gute RCFT-Prompts enthalten: konkrete Zielgruppe, messbares Format (Länge, Kanal), klare Aufgabe, mindestens zwei No-Gos.

  Typische Folgeprompts: Ton schärfen, Länge anpassen, Kanalwechsel.
