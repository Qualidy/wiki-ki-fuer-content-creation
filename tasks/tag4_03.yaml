title: Stil durch Beispiele vorgeben
difficulty: 3
question: |
  Hier sind zwei Posts im Stil einer fiktiven Marke:
  
  > „Montag, und du hast schon drei Dinge erledigt? Respekt. Unser neues Notizbuch hilft dir, dieses Tempo zu halten."
  
  > „Ideen kommen morgens um 3 Uhr. Gut, dass du sie irgendwo festhalten kannst."
  
  **Aufgabe:** Nutze diese Beispiele als Stilvorlage und lass die KI einen dritten Post schreiben – über ein neues digitales Notizbuch (App, kostenlos, keine Anmeldung nötig).
  
  Formuliere den Prompt so, dass klar ist: Die KI soll diesen Stil treffen, nicht einen anderen.
tip: |
  Zeig der KI die Beispiele im Prompt und beschreib kurz, was diesen Stil ausmacht (z. B. kurze Sätze, direkter Ton, leichter Humor).
solution: |
  Beispiel-Prompt:
  
  > Unser Stil klingt so: „[Beispiel A]" und „[Beispiel B]". Kurze Sätze, direkter Ton, ein leichter Augenzwinkern. Schreib einen dritten Post über unsere neue Notiz-App – kostenlos, keine Anmeldung nötig. Max. 60 Wörter, Du-Form, kein Emoji.
