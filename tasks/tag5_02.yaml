title: Persona-Block entwickeln und testen
difficulty: 1
question: |
  Entwickle für eine Marke (echt oder fiktiv) einen **Persona-Block** (max. 6 Sätze): Ton, Ansprache, mindestens drei No-Gos.

  Nutze den Block in **Copilot Chat** für diesen Prompt:

  > [Persona-Block] Schreib eine Website-Einleitung (ca. 50 Wörter) für [Produkt oder Anlass deiner Wahl].

  Formuliere einen Folgeprompt, der den Text an die Markenstimme anpasst, falls das Ergebnis noch zu generisch wirkt.
tip: |
  Persona-Blöcke werden in Copilot direkt im Prompt eingesetzt – nicht in separaten Profileinstellungen.
solution: |
  Beispiel-Folgeprompt:

  > Formuliere direkter und weniger werblich. Entferne Superlative. Ton aus dem Persona-Block beibehalten.
